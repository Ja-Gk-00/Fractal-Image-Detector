repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi, jupyter]
      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: clang-format
        name: C format
        entry: uv run --locked clang-format --dry-run --Werror
        language: system
        types: [c]
