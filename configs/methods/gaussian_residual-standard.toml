task = "train"
workers = "auto"
batch_size = 64
output_dir = "../../outputs/methods/gaussian_residual-standard"

[data]
train = ["../../data-splits/train.csv"]
validation = ["../../data-splits/validation.parquet"]

[tracking]
enabled = false
uri = "http://127.0.0.1:5000"
experiment = "fractal-methods"
run_name = "gaussian_residual-standard"
image_logging = "batch"

[features]
scales = [2, 4, 8, 16, 32]
compression = false
residual = "gaussian"
svd_rank = 8
median_size = 3

[training]
regularization_c = 1.0
seed = 1337
max_iter = 5000
