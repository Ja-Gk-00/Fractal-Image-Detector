task = "train"
workers = "auto"
batch_size = 64
output_dir = "../../outputs/methods/gaussian_fractal-deep"

[data]
train = ["../../data-splits/train.csv"]
validation = ["../../data-splits/validation.parquet"]

[tracking]
enabled = false
uri = "http://127.0.0.1:5000"
experiment = "fractal-methods"
run_name = "gaussian_fractal-deep"
image_logging = "batch"

[features]
scales = [2, 4, 8, 16, 32, 64]
compression = false

[training]
regularization_c = 0.1
seed = 1337
max_iter = 5000

[neural]
architecture = "residual_fractal"
residual = "gaussian"
channels = 32
levels = 3
backbone_blocks = 8
dncnn_depth = 17
dncnn_channels = 64
median_size = 7
gaussian_sigma = 1.5
epochs = 50
patience = 15
batch_size = 16
learning_rate = 5e-05
device = "auto"
mixed_precision = false
