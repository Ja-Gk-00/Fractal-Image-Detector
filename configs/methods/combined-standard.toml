task = "train"
workers = "auto"
batch_size = 64
output_dir = "../../outputs/methods/combined-standard"

[data]
train = ["../../data-splits/train.csv"]
validation = ["../../data-splits/validation.parquet"]

[tracking]
enabled = false
uri = "http://127.0.0.1:5000"
experiment = "fractal-methods"
run_name = "combined-standard"
image_logging = "batch"

[features]
scales = [2, 4, 8, 16, 32]
compression = true
max_domains = 64
stride = 8
multifractal = true
moment_orders = [-4.0, -2.0, -1.0, 0.0, 1.0, 2.0, 4.0]
low_correlation = true
pca_ranks = [28]
residual = "svd"
svd_rank = 28

[training]
regularization_c = 1.0
seed = 1337
max_iter = 5000
